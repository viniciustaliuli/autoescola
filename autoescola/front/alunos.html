<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoescola</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="div1">
            <h1>Cadastre um aluno</h1>
        </div>
    </div>

    <div class="container2">
        <div class="container_formulario">

            <form action="http://localhost/autoescola/back/index.php?rota=adicionaraluno/create" method="post">

                <input type="text" name="aluno" placeholder="Digite o nome:" required>
                <br>

                <input type="email" name="email" placeholder="Digite o email:" required>
                <br>

                <input type="text" name="telefone" placeholder="Digite o telefone:" required>
                <br>

                <input type="date" name="data_nascimento" required>
                <br>

                <input type="submit" value="Enviar" id="botao">

            </form>

        </div>
    </div>
</body>

</html>
